services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file:
      - .env.production
    ports:
      - "8000:8000"
    volumes:
      - ./db:/app/db
      - ./cloned_repos:/app/cloned_repos

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    environment:
      API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
